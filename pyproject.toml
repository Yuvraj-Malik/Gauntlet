[project]
name = "gauntlet-guard"
version = "0.1.0"
description = "Red-team benchmark and runtime guard for AI agents that move money through PayPal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "python-dotenv>=1.0", "playwright>=1.44"]

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["litellm>=1.40"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gauntlet"]
